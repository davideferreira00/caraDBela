<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Gerir Tipos de Dispositivos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    h1 { color: #2c3e50; }
    .type-list { margin-top: 20px; }
    .type-item { 
      background: #f8f9fa; 
      padding: 10px; 
      margin-bottom: 10px; 
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
    }
    .add-type { margin-top: 20px; }
    input, button { padding: 8px; margin-right: 10px; }
  </style>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
  <h1>Gerir Tipos de Dispositivos</h1>
  
  <div class="type-list" id="typeList"></div>
  
  <div class="add-type">
    <h2>Adicionar Novo Tipo</h2>
    <input type="text" id="newTypeName" placeholder="Nome do tipo">
    <input type="text" id="newTypeIcon" placeholder="Ícone (opcional)">
    <button id="addTypeBtn">Adicionar</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    
    if (!token) {
      window.location.href = 'login.html';
    }
    
    function loadTypes() {
      fetch('/device-types', {
        headers: {
          'Authorization': 'Bearer ' + token
        }
      })
      .then(res => res.json())
      .then(types => {
        const typeList = document.getElementById('typeList');
        typeList.innerHTML = '';
        
        types.forEach(type => {
          const div = document.createElement('div');
          div.className = 'type-item';
          div.innerHTML = `
            <span>${type.name} ${type.icon ? `(${type.icon})` : ''}</span>
            <button onclick="deleteType('${type._id}')">Eliminar</button>
          `;
          typeList.appendChild(div);
        });
      });
    }
    
    document.getElementById('addTypeBtn').addEventListener('click', () => {
      const name = document.getElementById('newTypeName').value.trim();
      const icon = document.getElementById('newTypeIcon').value.trim();
      
      if (!name) {
        alert('Por favor, insira um nome para o tipo.');
        return;
      }
      
      fetch('/device-types', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ name, icon })
      })
      .then(res => {
        if (!res.ok) throw new Error('Erro ao adicionar tipo');
        return res.json();
      })
      .then(() => {
        document.getElementById('newTypeName').value = '';
        document.getElementById('newTypeIcon').value = '';
        loadTypes();
      })
      .catch(err => alert(err.message));
    });
    
    function deleteType(id) {
      if (!confirm('Tem certeza que deseja eliminar este tipo?')) return;
      
      fetch(`/device-types/${id}`, {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + token
        }
      })
      .then(res => {
        if (!res.ok) throw new Error('Erro ao eliminar tipo');
        loadTypes();
      })
      .catch(err => alert(err.message));
    }

    fetch('navbar.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('navbar-container').innerHTML = data;
    });

    if (!token) {
  alert('Acesso negado. Faça login primeiro.');
  window.location.href = '/login.html';
}

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }

    loadTypes();
  </script>
</body>
</html>
