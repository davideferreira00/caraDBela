<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dispositivos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text: black">
    <div id="navbar-container"></div>
  <div class="container py-5">
  <h2 class="mb-4">Dispositivos por Utilizador</h2>
  <div id="deviceList" class="row g-4"></div>
</div>

  <script>
    const token = localStorage.getItem('token');
  const isAdmin = localStorage.getItem('isAdmin') === 'true';

  if (!token || !isAdmin) {
    alert('Acesso apenas para administradores.');
    window.location.replace('login.html');
    throw new Error("Bloqueado.");
  }

  fetch('/devices-by-user', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('deviceList');
    for (const [userId, info] of Object.entries(data)) {
      const col = document.createElement('div');
      col.className = 'col-md-6';

      const card = document.createElement('div');
      card.className = 'card';

      const body = document.createElement('div');
      body.className = 'card-body';

      const title = document.createElement('h5');
      title.className = 'card-title';
      title.textContent = `Utilizador: ${info.username}`;
      body.appendChild(title);

      if (info.devices.length) {
        const table = document.createElement('table');
        table.className = 'table table-sm';

        table.innerHTML = `
          <thead>
            <tr>
              <th>IP</th>
              <th>MAC</th>
              <th>Nome</th>
              <th>Adicionado em</th>
            </tr>
          </thead>
          <tbody>
            ${info.devices.map(d => `
              <tr>
                <td>${d.ip}</td>
                <td>${d.mac}</td>
                <td>${d.name}</td>
                <td>${new Date(d.addedAt).toLocaleString()}</td>
              </tr>
            `).join('')}
          </tbody>
        `;
        body.appendChild(table);
      } else {
        body.innerHTML += '<p class="text-muted">Sem dispositivos registados.</p>';
      }

      card.appendChild(body);
      col.appendChild(card);
      container.appendChild(col);
    }
  });

  fetch('navbar.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('navbar-container').innerHTML = data;
    });

if (!token) {
  alert('Acesso negado. Faça login primeiro.');
  window.location.href = '/login.html';
}

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }
  </script>
</body>
</html>
