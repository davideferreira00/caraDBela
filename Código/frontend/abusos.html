<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Relatórios de Abuso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text: black">
    <div id="navbar-container"></div>
  <div class="container py-5">
  <h2 class="mb-4">Relatórios de Abuso por Utilizador</h2>
  <div id="reportList" class="table-responsive">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Utilizador</th>
          <th>Motivo</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody id="reportTableBody"></tbody>
    </table>
  </div>
</div>

  <script>
    const token = localStorage.getItem('token');
  const isAdmin = localStorage.getItem('isAdmin') === 'true';

  if (!token || !isAdmin) {
    alert('Acesso apenas para administradores.');
    window.location.replace('login.html');
    throw new Error("Bloqueado.");
  }

  fetch('/reports', {
  headers: { 'Authorization': 'Bearer ' + token }
})
.then(res => res.json())
.then(reports => {
  console.log("Relatórios recebidos:", reports);
  const body = document.getElementById('reportTableBody');

  body.innerHTML = '';

  for (const username in reports) {
    if (reports.hasOwnProperty(username)) {
      const userReports = reports[username];

      userReports.forEach(r => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${username}</td>
          <td>${r.reason}</td>
          <td>${new Date(r.date).toLocaleString()}</td>
        `;
        body.appendChild(row);
      });
    }
  }
});

  fetch('navbar.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('navbar-container').innerHTML = data;
    });

if (!token) {
  alert('Acesso negado. Faça login primeiro.');
  window.location.href = '/login.html';
}

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }
  </script>
</body>
</html>
