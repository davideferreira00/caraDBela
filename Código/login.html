<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login e Coleta de Dados Silenciosa</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #34495e, #2c3e50);
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ecf0f1;
  }
  .container {
    background: #2c3e50;
    width: 360px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    padding: 30px 40px;
    text-align: center;
  }
  h2 {
    margin-bottom: 25px;
    color: #1abc9c;
    font-weight: 700;
    letter-spacing: 1.5px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 13px 15px;
    margin: 10px 0 25px 0;
    border-radius: 6px;
    border: none;
    font-size: 16px;
    color: #2c3e50;
    font-weight: 600;
  }
  button {
    width: 100%;
    padding: 14px 0;
    border: none;
    border-radius: 8px;
    background-color: #1abc9c;
    color: #2c3e50;
    font-size: 20px;
    cursor: pointer;
    font-weight: 700;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #16a085;
  }
  #error-msg {
    color: #e74c3c;
    font-weight: 600;
    margin-bottom: 15px;
    min-height: 20px;
  }
</style>
</head>
<body>
  <div class="container" id="login-container">
    <h2>LOGIN</h2>
    <div id="error-msg"></div>
    <input type="text" id="username" placeholder="Usuário" autocomplete="off" />
    <input type="password" id="password" placeholder="Senha" autocomplete="off" />
    <button id="login-button">Entrar</button>
  </div>

<script>
  const USER = 'admin';
  const PASS = '1234';

  const loginContainer = document.getElementById('login-container');
  const loginButton = document.getElementById('login-button');
  const errorMsg = document.getElementById('error-msg');

  loginButton.addEventListener('click', () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if(username === USER && password === PASS) {
      errorMsg.textContent = '';
      collectAndStoreData(username);
      alert('Login realizado com sucesso!');
      executeScript(); // Chama a função para executar o script
    } else {
      errorMsg.textContent = 'Usuário ou senha incorretos!';
    }
  });

  function collectAndStoreData(username) {
    // Busca IP público via serviço
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        const userData = {
          username: username,
          ip: data.ip,
          timestamp: new Date().toISOString()
        };
        // Armazena no localStorage silenciosamente
        localStorage.setItem('userData', JSON.stringify(userData));
      })
      .catch(() => {
        // Mesmo em caso de erro não exibe nada
      });
  }

  function executeScript() {
    fetch('/execute-script', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      }
    })
    .then(response => response.text())
    .then(data => {
      console.log('Resultado do script:', data);
      alert('Script executado com sucesso! Veja o console para detalhes.');
    })
    .catch(error => {
      console.error('Erro ao executar o script:', error);
      alert('Erro ao executar o script.');
    });
  }
</script>
</body>
</html>
